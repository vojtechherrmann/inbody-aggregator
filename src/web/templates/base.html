{% from "_ui.html" import icon %}<!doctype html>
<html lang="{{ lang }}"{% if theme %} data-theme="{{ theme }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  {# htmx: no eval (hx-on / js: are off), no injected indicator <style> -- both keep the CSP strict #}
  <meta name="htmx-config" content='{"allowEval": false, "includeIndicatorStyles": false, "allowScriptTags": false}'>
  <title>{% block title %}{{ t("app.name") }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ static_url('app.css') }}">
  {% block head %}{% endblock %}
  <script src="{{ static_url('vendor/htmx-2.0.4.min.js') }}" defer></script>
  <script src="{{ static_url('shell.js') }}" defer></script>
  <script src="{{ static_url('pwtoggle.js') }}" defer data-show="{{ t('pw.show') }}"></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
<header class="band appbar">
  <div class="inner">
    <a href="/" class="brand" aria-label="{{ t('app.name') }}"><b>InBody</b> <span>Aggregator</span></a>
    <div class="grow"></div>
    <div class="actions">
      {% if user %}
        {% if is_guest %}
          {# The guest account is read-only: shown, disabled (the server refuses these anyway). #}
          <span class="btn-primary" aria-disabled="true" title="{{ t('guest.unavailable') }}">{{ icon("upload") }}<span>{{ t("nav.upload") }}</span></span>
          <span class="btn-quiet" aria-disabled="true" title="{{ t('guest.unavailable') }}">{{ icon("share") }}<span>{{ t("nav.sharing") }}</span></span>
        {% else %}
          {# always about MY account, also while I look at a friend's data #}
          <a class="btn-primary" href="/upload">{{ icon("upload") }}<span>{{ t("nav.upload") }}</span></a>
          <a class="btn-quiet" href="/sharing">{{ icon("share") }}<span>{{ t("nav.sharing") }}</span></a>
        {% endif %}
        <details class="menu settings">
          <summary class="btn-quiet">{{ icon("gear") }}<span>{{ t("nav.settings") }}</span></summary>
          <form class="menu-panel" method="post" action="/settings" data-autosubmit>
            <input type="hidden" name="csrf_token" value="{{ csrf }}">
            <input type="hidden" name="next" value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}">
            <fieldset>
              <legend>{{ t("settings.language") }}</legend>
              <label><input type="radio" name="lang" value="cs" {% if lang == "cs" %}checked{% endif %}> <span lang="cs">Čeština</span></label>
              <label><input type="radio" name="lang" value="en" {% if lang == "en" %}checked{% endif %}> <span lang="en">English</span></label>
            </fieldset>
            <fieldset>
              <legend>{{ t("settings.appearance") }}</legend>
              <label><input type="radio" name="theme" value="dark" {% if settings.theme == "dark" %}checked{% endif %}> {{ t("settings.theme_dark") }}</label>
              <label><input type="radio" name="theme" value="light" {% if settings.theme == "light" %}checked{% endif %}> {{ t("settings.theme_light") }}</label>
              <label><input type="radio" name="theme" value="system" {% if settings.theme == "system" %}checked{% endif %}> {{ t("settings.theme_system") }}</label>
            </fieldset>
            <fieldset>
              <legend>{{ t("settings.units") }}</legend>
              <label><input type="radio" name="mass" value="metric" {% if settings.mass == "metric" %}checked{% endif %}> {{ t("settings.metric") }}</label>
              <label><input type="radio" name="mass" value="imperial" {% if settings.mass == "imperial" %}checked{% endif %}> {{ t("settings.imperial") }}</label>
              <div class="set-sub">{{ t("settings.energy") }}</div>
              <label><input type="radio" name="energy" value="kcal" {% if settings.energy == "kcal" %}checked{% endif %}> kcal</label>
              <label><input type="radio" name="energy" value="kJ" {% if settings.energy == "kJ" %}checked{% endif %}> kJ</label>
            </fieldset>
            <button type="submit" class="btn-quiet settings-save">{{ t("settings.save") }}</button>
            {% if not is_guest %}<a class="menu-link" href="/account/password">{{ t("settings.password") }}</a>{% endif %}
          </form>
        </details>
        {% if user.is_admin %}<a class="ghost" href="/admin">{{ t("nav.admin") }}</a>{% endif %}
        <form method="post" action="/logout" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf }}">
          <button type="submit" class="ghost">{{ t("nav.logout") }}</button>
        </form>
      {% else %}
        <form method="post" action="/lang" class="inline lang-switch">
          <input type="hidden" name="csrf_token" value="{{ csrf }}">
          <input type="hidden" name="next" value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}">
          {% for code in langs %}
            <button type="submit" name="lang" value="{{ code }}" class="lang" lang="{{ code }}"
                    {% if code == lang %}aria-current="true"{% endif %}>{{ code | upper }}</button>
          {% endfor %}
        </form>
      {% endif %}
    </div>
  </div>
</header>
<div class="band mobile-notice" role="note"><div class="inner"><span>{{ t("notice.mobile") }}</span><button type="button" class="mobile-notice-x" data-dismiss-notice aria-label="{{ t('notice.mobile_close') }}"><span aria-hidden="true">&#x2715;</span></button></div></div>
{% if is_guest %}<div class="band guest-banner" role="note"><div class="inner">{{ t("guest.banner") }}</div></div>{% endif %}
<div class="band">
  <div class="inner">
    {% block tabs %}{% endblock %}
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
{# Decoration only: two different random quotes in the side margins of wide screens (CSS hides
   them below ~1500 px). Not announced, not focusable, no JS. #}
<div class="quote quote-l q{{ quotes[0] }}" aria-hidden="true"><p>{{ t("quote." ~ quotes[0]) }}</p></div>
<div class="quote quote-r q{{ quotes[1] }}" aria-hidden="true"><p>{{ t("quote." ~ quotes[1]) }}</p></div>
<footer class="site-footer band">&copy; {{ current_year() }} <a href="{{ homepage_url }}" rel="noopener">VojtaH</a> · <a href="/data">{{ t("privacy.summary") }}</a> · <a href="{{ github_url }}" rel="noopener">GitHub</a> <span class="build">· {{ build_label() }}</span></footer>
{% block scripts %}{% endblock %}
</body>
</html>
