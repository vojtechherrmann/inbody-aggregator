{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1>{{ t("landing.title") }}</h1>
  <p>{{ t("landing.text") }}</p>
  <div class="cta">
    <a href="/login" class="btn-primary">{{ t("landing.login") }}</a>
    <form method="post" action="/login/guest" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <button type="submit" class="btn-quiet">{{ t("guest.login") }}</button>
    </form>
  </div>
  <p class="muted small">{{ contact_text("landing.no_registration", "account") }}</p>
</section>
{% endblock %}
