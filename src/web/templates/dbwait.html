<!doctype html>
<html lang="{{ lang }}"{% if theme %} data-theme="{{ theme }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  {# without JS the page still retries on its own #}
  <noscript><meta http-equiv="refresh" content="6"></noscript>
  <title>{{ t("db.starting_title") }} &middot; {{ t("app.name") }}</title>
  <link rel="stylesheet" href="{{ static_url('app.css') }}">
  <script src="{{ static_url('dbwait.js') }}" defer></script>
</head>
<body>
<header class="band appbar">
  <div class="inner">
    <a href="/" class="brand" aria-label="{{ t('app.name') }}"><b>InBody</b> <span>Aggregator</span></a>
  </div>
</header>
<div class="band db-banner" role="status" aria-live="polite"><div class="inner">{{ t("db.starting") }}</div></div>
<div class="band">
  <div class="inner">
    <main id="dbwait" data-target="{{ target }}" data-status="/dbstatus">
      <section class="hero">
        <h1>{{ t("db.starting_title") }}</h1>
        <p>{{ t("db.starting_text") }}</p>
        <p class="db-dots" aria-hidden="true"><span></span><span></span><span></span></p>
      </section>
    </main>
  </div>
</div>
<footer class="site-footer band">&copy; {{ current_year() }} VojtaH <span class="build">&middot; {{ build_label() }}</span></footer>
</body>
</html>
